[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "clirelay"
version = "8.5.0"
description = "A composable command-line interface toolkit, built from scratch."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Nick Serapiglia" }]
maintainers = [{ name = "Nick Serapiglia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://clirelay.readthedocs.io/"
Source = "https://github.com/nserapiglia/clirelay"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "tox",
    "tox-uv",
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "typing"},
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
    "sphinx-tabs",
]
tests = [
    "pytest",
    "hypothesis",
    "coverage",
]
typing = [
    "mypy",
    "pytest",
]

[tool.flit.module]
name = "clirelay"

[tool.flit.sdist]
include = ["tests/", "docs/", "examples/", "CHANGES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["default"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/clirelay"]
strict = false
