name: Update lock file
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Upgrade the lock file
        run: uv lock --upgrade
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update uv.lock"
          title: "chore: update uv.lock"
          branch: update/uv-lock
          delete-branch: true
