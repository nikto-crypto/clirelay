name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group tests --python ${{ matrix.python-version }}
      - name: Run unit tests
        # The differential suite needs the oracle, which is not available in CI;
        # it skips there. Unit tests stand alone.
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit -p no:warnings
