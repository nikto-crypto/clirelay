[tox]
envlist =
    py3{10,11,12,13,14,15}
    docs
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
dependency_groups = tests
commands =
    pytest tests/unit {posargs}

[testenv:oracle]
# Full differential suite against the oracle; requires the matching interpreter.
dependency_groups = tests
setenv =
    CLIRELAY_REQUIRE_ORACLE = 1
    COLUMNS = 80
commands =
    pytest -rs -p no:warnings {posargs}

[testenv:docs]
dependency_groups = docs
commands =
    sphinx-build -W -b html docs docs/_build/html
